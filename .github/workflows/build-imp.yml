# Official imp build. Kept separate from build-cuda.yml on purpose:
# scripts/build-inside.sh is llama.cpp end to end (LLAMA_* cmake flags,
# llama-server/llama-cli/llama-bench), and imp needs CUDA 13.4 where this repo
# builds 13.2. A matrix entry would mean threading a "kind" through every step
# of a working pipeline; a separate workflow keeps the fork lanes untouched.
#
# Publishes to the same repository as the fork releases:
#   tag    imp-<sha12>              (stable)
#   tag    imp-nightly-<sha12>       (prerelease)
#   asset  imp-cuda13.4-<mode>-amd64.tar.gz  -> binaries/imp/{imp-server,imp-cli}

name: Build imp

on:
  push:
    branches: [main]
    paths:
      - 'forks.json'
      - '.github/workflows/build-imp.yml'
      - 'scripts/build-imp-inside.sh'
  workflow_dispatch:
    inputs:
      mode:
        description: stable|nightly
        default: nightly
        type: string
      force_build:
        description: rebuild even if the release exists
        default: 'false'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-imp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve imp source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="${{ github.event.inputs.mode || 'nightly' }}"
          IMP_REPO=$(jq -r '.imp.repo' forks.json)
          IMP_BRANCH=$(jq -r '.imp.branch // "main"' forks.json)
          IMP_SUBDIR=$(jq -r '.imp.subdir' forks.json)

          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${IMP_REPO}/commits/${IMP_BRANCH}" | jq -r '.sha')
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "FATAL: cannot resolve ${IMP_REPO}@${IMP_BRANCH}" >&2
            exit 1
          fi
          echo "imp: ${IMP_REPO}@${IMP_BRANCH} -> ${SHA}"

          if [ "$MODE" = "stable" ]; then
            TAG="imp-${SHA:0:12}"
          else
            TAG="imp-nightly-${SHA:0:12}"
          fi

          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "cuda_tag=$(jq -r '.imp.cuda_tag // "13.4.2-devel-ubuntu26.04"' forks.json)" >> "$GITHUB_OUTPUT"
          echo "repo=${IMP_REPO}" >> "$GITHUB_OUTPUT"
          echo "subdir=${IMP_SUBDIR}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Skip if the release already exists
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          FORCE: ${{ github.event.inputs.force_build || 'false' }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "force_build: deleting $TAG to rebuild"
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes >/dev/null 2>&1 || true
              gh api -X DELETE "/repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG exists — skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Maximize build space
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          df -h

      - name: Setup compiler cache (ccache)
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-imp-cuda13.4-${{ steps.plan.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-imp-cuda13.4-

      - name: Build imp with CUDA 13.4
        if: steps.chk.outputs.skip != 'true'
        env:
          CUDA_TAG: ${{ steps.plan.outputs.cuda_tag }}
          MODE: ${{ steps.plan.outputs.mode }}
          IMP_REPO: ${{ steps.plan.outputs.repo }}
          REF: ${{ steps.plan.outputs.sha }}
          SUBDIR: ${{ steps.plan.outputs.subdir }}
        run: |
          mkdir -p "$PWD/.ccache"
          # Digest-pinned to the same toolkit the imp PLE CI builds with, so the
          # fork lanes (13.2) and the imp lane (13.4) never drift by tag.
          IMAGE="nvidia/cuda:${CUDA_TAG}@sha256:14fd494fd8496817a70700e4d2c52bd42de56c5d39c041bf8342814614d5fe56"
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ccache:/root/.ccache" \
            -e CCACHE_DIR=/root/.ccache \
            -e IMP_REPO="${IMP_REPO}" \
            -e REF="${REF}" \
            -e SUBDIR="${SUBDIR}" \
            -e MODE="${MODE}" \
            "$IMAGE" \
            bash /workspace/scripts/build-imp-inside.sh

      - name: Package tarball
        if: steps.chk.outputs.skip != 'true'
        run: |
          cd binaries
          tar -czf "imp-cuda13.4-${{ steps.plan.outputs.mode }}-amd64.tar.gz" "${{ steps.plan.outputs.subdir }}"
          ls -lh *.tar.gz

      - name: Publish release
        if: steps.chk.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="${{ steps.plan.outputs.mode }}"
          sha="${{ steps.plan.outputs.sha }}"
          tag="${{ steps.plan.outputs.tag }}"
          subdir="${{ steps.plan.outputs.subdir }}"
          f="binaries/imp-cuda13.4-${mode}-amd64.tar.gz"
          if [ ! -f "$f" ]; then
            echo "FATAL: built tarball missing: $f" >&2
            ls -l binaries/ || true
            exit 1
          fi
          # A blank line inside a double-quoted YAML scalar is what GitHub's
          # parser rejects ("Unexpected value"), so the notes are built in one line.
          NOTES="CUDA 13.4 (RTX 5090 / sm_120) build of **imp** ($mode) from ${sha}. Layout inside the tarball: ${subdir}/{imp-server,imp-cli,VERSION.txt}."
          prerelease_args=""
          [ "$mode" = "stable" ] || prerelease_args="--prerelease"
          echo "Publishing $tag from $f"
          gh release create "$tag" "$f" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "$NOTES" \
            $prerelease_args
          gh release view "$tag" --repo "${{ github.repository }}" --json url -q .url